{% extends 'base.html' %}
{% block content %}
<h2 class="mb-4">RTO Imports (Pending)</h2>
<div class="card bg-secondary p-3">
  <h5>Pending Imports</h5>
  <table class="table table-dark table-striped">
    <thead><tr><th>ID</th><th>Plate</th><th>Created</th><th>Actions</th></tr></thead>
    <tbody>
      {% for imp in imports %}
      <tr>
        <td>{{ imp.id }}</td>
        <td>{{ imp.plate_number }}</td>
        <td>{{ imp.created_at }}</td>
        <td>
          <a class="btn btn-sm btn-success" href="{{ url_for('approve_rto_import', import_id=imp.id) }}">Approve</a>
          <a class="btn btn-sm btn-secondary" href="{{ url_for('view_rto_import', import_id=imp.id) }}">View</a>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
