{% extends 'base.html' %}
{% block content %}
<h2 class="mb-4">Settings</h2>
<div class="row g-4">
  <div class="col-md-6">
    <div class="card bg-secondary">
      <div class="card-body">
        <h5 class="card-title">Camera Settings</h5>
        <p>Local webcam, IP camera, and RTSP source support are configured.</p>
      </div>
    </div>
  </div>
  <div class="col-md-6">
    <div class="card bg-secondary">
      <div class="card-body">
        <h5 class="card-title">OCR Settings</h5>
        <p>OCR confidence threshold is set in the configuration file.</p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
